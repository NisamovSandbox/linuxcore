    force user = nobody
    broseable = yes
    max connections = 25
# permisos
    create mask = 0664
    directory mask = 0664
    force create mide = 0664
    force directory mode = 0664
    inherit permissions = yes
# expulsion
    deadtime = 3
# vetar archivos
    veto files = /*.exe/*.txt/*.pdf/
    delete veto files = yes
# version2 obligatoria
    server min protocol = SMB_10
[usuarios]
    comment = carpeta usuarios
    browseable = yes
    guest ok = no
# usuarios y grupos
    valid users = @usuario1, @usuaro2
    write list = @usuario1
    read list = @usuario2
    admin users = @usuario1
# permisos
    create mask = 0664
    directory mask = 0775
    force create mide = 0664
    force directory mode = 0775
    inherit permissions = yes
# restricciones de red
    hosts allow = 192.168.1.0/24
    hosts deny = ALL
    wide links = no
# veto files
    veto files = /*.exe/    
    delete veto files = yes
# papelera
vfs objects = recycle
recycle:repository = .papelera
recycle:keeptree = yes
recycle:version = yes
recycle:exclude = *.tmp, *.temp
hide dots files = no

max connections = 50