[global]
    # Identificación y Red
    workgroup = WORKGROUP
    server string = Servidor de Archivos Corporativo v%v
    netbios name = FS-SAMBA01
    interfaces = 127.0.0.0/8 192.168.10.0/24
    bind interfaces only = yes
    # Seguridad y Autenticación
    server role = standalone server
    security = user
    map to guest = Bad User
    guest account = nobody
    # Restricción de protocolos inseguros (Desactiva SMB1 / NetBIOS vulnerables)
    server min protocol = SMB2_10
    server max protocol = SMB3
    client min protocol = SMB2
    smb encrypt = auto
    # Protecciones contra symlinks maliciosos
    unix extensions = no
    allow insecure wide links = no
    # Optimización de Rendimiento
    aio read size = 16384
    aio write size = 16384
    use sendfile = yes
    min receivefile size = 16384
    socket options = TCP_NODELAY IPTOS_LOWDELAY SO_RCVBUF=131072 SO_SNDBUF=131072
    # Logs y Registro
    log level = 1
    log file = /var/log/samba/log.%m
    max log size = 10000
    logging = file
    # Modulos VFS Globales (Compatibilidad con macOS Apple / macOS Finder)
    vfs objects = catia fruit streams_xattr
    fruit:metadata = stream
    fruit:model = MacSamba
    fruit:posix_rename = yes
    fruit:veto_appledouble = no
    fruit:wipe_deleted = yes
# DEFINICIÓN DE RECURSOS COMPARTIDOS (SHARES)
[Publico]
    comment = Recurso de Lectura Pública (Solo Usuarios Autenticados)
    path = /srv/samba/publico
    browseable = yes
    read only = yes
    guest ok = yes
    # Control de creación para usuarios autorizados
    write list = @admin_group
    create mask = 0664
    directory mask = 0775
[Proyectos_Departamental]
    comment = Área Colaborativa del Departamento
    path = /srv/samba/proyectos
    browseable = yes
    read only = no
    guest ok = no
    # Control de acceso restringido a grupo específico
    valid users = @departamento
    force group = departamento
    # Preservación de permisos y coherencia en equipo
    create mask = 0670
    directory mask = 2770
    force create mode = 0660
    force directory mode = 02770
    # Gestión de archivos bloqueados
    veto files = /*.exe/*.bat/*.vbs/*.msi/*.mp3/*.avi/
    delete veto files = yes
[Confidencial_Direccion]
    comment = Documentos de Acceso Restringido y Auditado
    path = /srv/samba/confidencial
    browseable = no
    read only = no
    guest ok = no
    # Acceso exclusivo individual
    valid users = director1, auditor_sys
    # Forzar cifrado en transferencia para este recurso
    smb encrypt = required
    # Integración con módulo VFS de auditoría para registrar accesos
    vfs objects = full_audit catia fruit streams_xattr
    full_audit:prefix = %u|%I|%m|%S
    full_audit:success = connect disconnect open mkdir rmdir unlink rename
    full_audit:failure = connect
    full_audit:facility = LOCAL7
    full_audit:priority = NOTICE